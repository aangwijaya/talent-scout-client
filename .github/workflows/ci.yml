name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail when schema.d.ts is out of date with openapi.yaml
        run: |
          pnpm gen:api
          git diff --exit-code -- src/lib/server/api/schema.d.ts || { echo "::error::Run pnpm gen:api and commit schema.d.ts"; exit 1; }
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium and its system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke (mock) and runtime auth checks
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The client with USE_MOCK=false against the Go server at the commit pinned in contract.lock.
  # Every secret here is a throwaway value generated in the job; nothing comes from GitHub secrets.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Throwaway local container: trust auth, so no password exists anywhere in the job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: talent_scout
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/talent_scout?sslmode=disable
      SERVER_DIR: .server
      # One host everywhere: the browser's EventSource goes straight to Go, and CORS compares the
      # exact origin (`localhost` and `127.0.0.1` are different origins).
      INTEGRATION_API_URL: http://localhost:8080
      APP_ENV: test
      LLM_MODE: fake
      EMAIL_MODE: log
      PORT: '8080'
      FRONTEND_ORIGIN: http://localhost:4175
      PUBLIC_APP_URL: http://localhost:4175
      # CV upload/download goes to tests/e2e/fake-storage.ts, never a real Supabase project.
      SUPABASE_URL: http://localhost:4181
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned server commit
        id: pin
        run: echo "server_commit=$(jq -re .server_commit contract.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: aangwijaya/talent-scout-server
          ref: ${{ steps.pin.outputs.server_commit }}
          path: ${{ env.SERVER_DIR }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.SERVER_DIR }}/go.mod
          cache-dependency-path: ${{ env.SERVER_DIR }}/go.sum
      - name: Generate throwaway test secrets
        run: |
          for name in AUTH_TOKEN_SECRET RECRUITER_PASSWORD BFF_SHARED_SECRET SUPABASE_SERVICE_ROLE_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "INTEGRATION_$name=$value" >> "$GITHUB_ENV"
          done
      - name: Migrate and seed the database
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          # The migrations revoke table access from Supabase's anon/authenticated roles,
          # which a plain Postgres container does not have.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
          go run ./cmd/migrate up
          go run ./cmd/seed -config config/seed-job.yaml
          title=$(yq -r '.title // .job.title // ""' config/seed-job.yaml)
          test -n "$title" || { echo "::error::No job title found in config/seed-job.yaml"; exit 1; }
          echo "INTEGRATION_SEED_JOB_TITLE=$title" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the fake Supabase Storage
        run: |
          nohup node tests/e2e/fake-storage.ts 4181 > "$RUNNER_TEMP/storage.log" 2>&1 &
          for _ in $(seq 20); do
            curl -sS -o /dev/null "$SUPABASE_URL/" && exit 0
            sleep 0.5
          done
          echo "::error::The fake storage did not start"
          cat "$RUNNER_TEMP/storage.log"
          exit 1
      - name: Start the Go server (LLM_MODE=fake, EMAIL_MODE=log)
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          # The API main is the only cmd/ package besides migrate and seed.
          mains=$(find cmd -mindepth 1 -maxdepth 1 -type d ! -name migrate ! -name seed)
          test "$(echo "$mains" | wc -l)" -eq 1 || { echo "::error::Expected one API main in cmd/, found: $mains"; exit 1; }
          go build -o "$RUNNER_TEMP/talent-scout-api" "./$mains"
          nohup "$RUNNER_TEMP/talent-scout-api" > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 60); do
            curl -fsS "$INTEGRATION_API_URL/api/v1/health?deep=1" && exit 0
            sleep 1
          done
          echo "::error::The Go server was not healthy after 60 s"
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: Install Playwright Chromium and its system libraries
        run: pnpm exec playwright install --with-deps chromium
      # Three runs of every flow in one job: the stability bar for the integration project.
      - name: Integration tests (real client against the Go server)
        run: pnpm exec playwright test --project integration --repeat-each 3
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true
      - name: Fake storage log
        if: always()
        run: cat "$RUNNER_TEMP/storage.log" || true
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: integration-traces
          path: test-results/
          retention-days: 7

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare contract files with the pinned server commit
        run: python3 scripts/check-contract.py
      - name: Reject removed SvelteKit APIs in docs
        run: "! git grep -nE '\\$env/(dynamic|static)' -- '*.md' ':!docs/LESSONS.md'"

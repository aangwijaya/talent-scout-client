name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare contract files with the pinned server commit
        run: python3 scripts/check-contract.py
      - name: Reject removed SvelteKit APIs in docs
        run: "! git grep -nE '\\$env/(dynamic|static)' -- '*.md' ':!docs/LESSONS.md'"

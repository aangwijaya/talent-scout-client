name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  contract-sync:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'contract-change')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare contract docs with the server repo
        run: |
          for f in API.md EVENTS.md PRD.md; do
            curl -fsSL "https://raw.githubusercontent.com/aangwijaya/talent-scout-server/main/docs/$f" -o "/tmp/$f"
            cmp "docs/$f" "/tmp/$f" || { echo "::error file=docs/$f::differs from talent-scout-server main"; exit 1; }
          done
